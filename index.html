<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minha Biblioteca V2</title><style>body{margin:0;background:#141414;color:#fff;font-family:Arial}header{background:#000;padding:20px;text-align:center}main{max-width:1300px;margin:auto;padding:20px}.top{display:flex;gap:10px;flex-wrap:wrap}.card{background:#1e1e1e;padding:15px;border-radius:12px}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:15px;margin-top:20px}input,button,select{padding:10px;border-radius:8px;border:none}button{background:#e50914;color:#fff}.item{background:#222;border-radius:12px;overflow:hidden}.item img,.item video{width:100%;height:220px;object-fit:cover}.cap{padding:10px}</style></head><body><header><h1>📚 Minha Biblioteca</h1><p>GitHub Pages + Firebase Storage</p></header><main><div class="card"><div class="top"><input type="file" id="file" multiple accept="image/*,video/*"><input id="search" placeholder="Buscar..."><select id="filter"><option value="all">Todos</option><option value="image">Imagens</option><option value="video">Vídeos</option></select><button onclick="uploadFiles()">Enviar</button></div><p>Configure seu Firebase nas constantes abaixo.</p></div><div class="gallery" id="gallery"></div></main><script type="module">import{initializeApp}from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';import{getStorage,ref,uploadBytes,getDownloadURL,listAll}from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js';const firebaseConfig={apiKey:'COLOQUE_AQUI',authDomain:'COLOQUE_AQUI',projectId:'COLOQUE_AQUI',storageBucket:'COLOQUE_AQUI',appId:'COLOQUE_AQUI'};let storage=null;try{storage=getStorage(initializeApp(firebaseConfig));loadMedia();}catch(e){console.log('Configurar Firebase');}window.uploadFiles=async()=>{if(!storage)return alert('Configure o Firebase');for(const f of file.files){const r=ref(storage,'midias/'+Date.now()+'_'+f.name);await uploadBytes(r,f);}loadMedia();};async function loadMedia(){if(!storage)return;const root=ref(storage,'midias');const data=await listAll(root);const gal=document.getElementById('gallery');gal.innerHTML='';for(const i of data.items){const url=await getDownloadURL(i);const isVideo=/\.(mp4|mov|webm|avi)$/i.test(i.name);const div=document.createElement('div');div.className='item';div.dataset.name=i.name.toLowerCase();div.dataset.type=isVideo?'video':'image';div.innerHTML=isVideo?'<video controls src="'+url+'"></video><div class="cap">'+i.name+'</div>':'<img src="'+url+'"><div class="cap">'+i.name+'</div>';gal.appendChild(div);}applyFilter();}window.applyFilter=()=>{const t=filter.value;const s=search.value.toLowerCase();document.querySelectorAll('.item').forEach(x=>{const okType=t==='all'||x.dataset.type===t;const okSearch=x.dataset.name.includes(s);x.style.display=(okType&&okSearch)?'block':'none';});};search.oninput=applyFilter;filter.onchange=applyFilter;</script></body></html>
