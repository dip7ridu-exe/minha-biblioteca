<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minha Biblioteca</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial;background:#141414;color:#fff}header{background:#000;padding:20px;text-align:center;position:sticky;top:0}main{max-width:1400px;margin:auto;padding:20px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;background:#1d1d1d;padding:15px;border-radius:12px}.toolbar input,.toolbar button,.toolbar select{padding:10px;border-radius:8px;border:none}.toolbar button{background:#e50914;color:#fff;cursor:pointer}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:15px;margin-top:20px}.card{background:#222;border-radius:12px;overflow:hidden}.card img,.card video{width:100%;height:220px;object-fit:cover}.info{padding:10px}.delete{width:100%;background:#b91c1c;color:#fff;border:none;padding:10px}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);justify-content:center;align-items:center}.modal img,.modal video{max-width:90%;max-height:90%}</style></head><body><header><h1>📚 Minha Biblioteca</h1><p>Google Fotos + Netflix</p></header><main><div class="toolbar"><input type="file" id="files" multiple accept="image/*,video/*"><button onclick="uploadFiles()">Enviar</button><input id="search" placeholder="Buscar arquivo"><select id="filter"><option value='all'>Todos</option><option value='image'>Imagens</option><option value='video'>Vídeos</option></select></div><div id="status"></div><div class="gallery" id="gallery"></div></main><div class="modal" id="modal" onclick="this.style.display='none'"></div><script>const SUPABASE_URL='https://uwywbspdbmxrnmkdborm.supabase.co';const SUPABASE_KEY='sb_publishable_AVWh-xt26lQJcZuf0r9xSw_Gxrmjbt5';const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const bucket='midias';async function uploadFiles(){const files=document.getElementById('files').files;for(const f of files){document.getElementById('status').innerText='Enviando '+f.name;const name=Date.now()+'_'+f.name;const {error}=await client.storage.from(bucket).upload(name,f);if(error)alert(error.message);}loadFiles();document.getElementById('status').innerText='Upload concluído';}async function loadFiles(){const {data,error}=await client.storage.from(bucket).list('',{limit:1000});if(error)return;const gal=document.getElementById('gallery');gal.innerHTML='';for(const file of data){const {data:urlData}=client.storage.from(bucket).getPublicUrl(file.name);const url=urlData.publicUrl;const isVideo=/\.(mp4|mov|webm|avi|mkv)$/i.test(file.name);const card=document.createElement('div');card.className='card';card.dataset.name=file.name.toLowerCase();card.dataset.type=isVideo?'video':'image';card.innerHTML=(isVideo?`<video onclick="openMedia('${url}','video')" src='${url}'></video>`:`<img onclick="openMedia('${url}','image')" src='${url}'>`)+`<div class='info'>${file.name}</div><button class='delete' onclick="deleteFile('${file.name}')">Excluir</button>`;gal.appendChild(card);}applyFilter();}async function deleteFile(name){if(!confirm('Excluir arquivo?'))return;await client.storage.from(bucket).remove([name]);loadFiles();}function openMedia(url,type){const m=document.getElementById('modal');m.style.display='flex';m.innerHTML=type==='video'?`<video controls autoplay src='${url}'></video>`:`<img src='${url}'>`;}function applyFilter(){const s=document.getElementById('search').value.toLowerCase();const t=document.getElementById('filter').value;document.querySelectorAll('.card').forEach(c=>{const ok=(t==='all'||c.dataset.type===t)&&c.dataset.name.includes(s);c.style.display=ok?'block':'none';});}document.getElementById('search').oninput=applyFilter;document.getElementById('filter').onchange=applyFilter;loadFiles();</script></body></html>
